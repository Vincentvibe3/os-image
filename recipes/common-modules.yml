modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - rpmfusion-free-release-tainted

  - type: dnf
    repos:
      # copr:
      #   - 
      nonfree: rpmfusion
      files:
        - vscode.repo
        - kopia.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc # For VSCode
        - https://kopia.io/signing-key
    install:
      packages:
        - neovim
        - niri
        - noctalia
        - zsh
        - foot
        # - ptyxis
        - code
        - google-noto-fonts-all
        - google-noto-emoji-fonts
        - google-noto-color-emoji-fonts 
        - libdvdcss
        - podman 
        - buildah
        - skopeo
        - toolbox
        - distrobox
        - NetworkManager-tui
        - gnupg2-scdaemon
        - yubikey-manager
        - blueman
        - dislocker
        # - swaybg
        # - swayidle
        - zsh
        - powertop
        # - polkit-kde
        - ibus-mozc
        # - kf6-kirigami-devel
        # - kf5-kirigami-devel
        - screen
        - tmux
        - docker-cli
        - containerd
        - runc
        - docker-compose
        - docker-compose-switch
        - ibus-mozc
        - ibus
        - kopia
        - kopia-ui
        - waydroid
        - stlink
        - htop
        - fzf 
        - gum
        - pass
        - brightnessctl
        - zoxide
      exclude:
        - alacritty
        - mako

    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - input-remapper
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: default-flatpaks
    configurations:
      - notify: false # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          # Browser
          - org.mozilla.firefox
          
          # Flatpak Management
          - io.github.flattool.Warehouse
          - io.github.flattool.Ignition
          - com.github.tchx84.Flatseal
          - io.github.kolunmi.Bazaar

          # Container tools
          - com.ranfdev.DistroShelf

          # Misc
          - org.fedoraproject.MediaWriter
          - io.missioncenter.MissionCenter

          # Gnome Apps
          - org.gnome.Logs
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Snapshot
          - org.gnome.clocks
          - org.gnome.Connections
          - org.gnome.Contacts
          - org.gnome.baobab
          - org.gnome.SimpleScan
          - org.gnome.Papers
          - org.gnome.Firmware
          - org.gnome.font-viewer
          - org.gnome.Loupe
          - org.gnome.Maps
          - org.gnome.SoundRecorder
          - org.gnome.NautilusPreviewer
          - org.gnome.TextEditor
          - org.gnome.Showtime
          - org.gnome.Weather
          - org.gnome.Characters
          - org.gnome.seahorse.Application
          
  - type: default-flatpaks
    configurations:
      - notify: false # Send notification after install/uninstall is finished (true/false)
      - scope: user # Also add Flathub user repo, but no user packages
        install:
          # Development
          - io.podman_desktop.PodmanDesktop
          - org.chromium.Chromium
          - dev.geopjr.Collision

          # Productivity
          - org.mozilla.thunderbird
          - io.github.finefindus.Hieroglyphic
          - com.github.flxzt.rnote
          - com.github.jeromerobert.pdfarranger
          - org.libreoffice.LibreOffice
          - org.octave.Octave

          # Gaming
          - com.valvesoftware.Steam
          - com.discordapp.Discord
          - com.modrinth.ModrinthApp
          - org.prismlauncher.PrismLauncher
          - com.heroicgameslauncher.hgl

          # Creative
          - com.github.PintaProject.Pinta
          - org.darktable.Darktable
          - com.rawtherapee.RawTherapee
          - com.github.finefindus.eyedropper
          - fr.handbrake.ghb
          - com.github.PintaProject.Pinta
          - org.inkscape.Inkscape
          - org.gimp.GIMP
          - org.kde.krita

          # Customization
          - com.mattjakeman.ExtensionManager
          - page.tesk.Refine
          - com.github.wwmm.easyeffects

          # Media
          - nl.andreasknoben.Laser
          - app.drey.EarTag
          - com.spotify.Client
          - org.videolan.VLC
          - com.obsproject.Studio
          - com.github.neithern.g4music

          # Misc
          - it.mijorus.smile
          
  - type: brew
    brew-analytics: false # disable telemetry
    auto-upgrade: true
    auto-update: true

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode # don't add spaces or "Nerd Font" suffix
        - 0xProto
        - CascadiaCode
        - CascadiaMono
        - Iosevka
        - NerdFontsSymbolsOnly
      google-fonts:
        - Roboto
        - Inter

  - type: systemd
    
    # system:
      # enabled:
    user:
      enabled:
        - podman.socket

  - type: justfiles
    validate: true
    install: true

  - type: files
    files:
      - source: grub2  
        destination: /usr/share/grub-config

  - type: script
    scripts:
      - remove-desktop-entries.sh

  # Clean up to pass bootc lint
  # - type: script
  #   snippets:
  #     - "rm -rf /tmp/nvim.root"

  - type: signing # this sets up the proper policy & signing files for signed images to work fully


