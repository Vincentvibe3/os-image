---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: os-image-nvidia
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 44@sha256:3318ebff7eada58e23c3aa8dc84349638b109a866fcd6cb5e9e150687179e701  # You can pin to a specific version of Fedora as well

stages:
  - from-file: common-stages.yml

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - from-file: finpilot-setup.yml

  - type : containerfile
    env: 
      BASE_IMAGE_NAME : silverblue
    snippets:
      - RUN --mount=type=bind,from=ctx,source=/,target=/ctx \
        --mount=type=cache,dst=/var/cache/libdnf5 \
        --mount=type=cache,dst=/var/cache/rpm-ostree \
        --mount=type=secret,id=GITHUB_TOKEN \
        --mount=type=tmpfs,dst=/boot \
        --mount=type=tmpfs,dst=/tmp \
        /ctx/build/40-nvidia.sh

  - from-file: common-modules.yml

  - type: dnf
    repos:
      nonfree: rpmfusion
      
    install:
      packages:
        - libva-nvidia-driver